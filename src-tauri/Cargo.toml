[package]
name = "vibe"
version = "1.0.0"
edition = "2021"

[lib]
name = "vibe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-cli = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
thiserror = "1"
tokio = { version = "1", features = ["sync"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
